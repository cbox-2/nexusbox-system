<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<style>
body { font-family: Arial; background: #f5f5f5; padding: 20px; }
.container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
h1 { color: #667eea; }
.box-item { background: #f9f9f9; padding: 15px; margin: 10px 0; border-radius: 5px; border-right: 4px solid #667eea; }
.btn { background: #667eea; color: white; padding: 8px 16px; text-decoration: none; border-radius: 5px; display: inline-block; margin: 5px; }
</style>
</head>
<body>
<div class="container">
  <h1>📊 Admin Dashboard</h1>
  <div id="boxes">Loading...</div>
</div>
<script>
const API = window.location.origin;
const TOKEN = localStorage.getItem('token');

async function load() {
  if (!TOKEN) { alert('Login required'); window.location.href = '/test.html'; return; }
  
  try {
    const res = await fetch(API + '/api/boxes', {
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    });
    const data = await res.json();
    
    if (data.success) {
      let html = '<h2>Total Boxes: ' + data.boxes.length + '</h2>';
      data.boxes.forEach(box => {
        html += '<div class="box-item">';
        html += '<h3>' + box.name + '</h3>';
        html += '<p>Slug: ' + box.slug + '</p>';
        html += '<p>Status: ' + box.status + '</p>';
        html += '<a href="/admin/snippet.html?key=' + box.embedKey + '" class="btn">Get Embed Code</a>';
        html += '<a href="/embed.html?key=' + box.embedKey + '" class="btn" style="background:#48bb78">View Box</a>';
        html += '</div>';
      });
      document.getElementById('boxes').innerHTML = html;
    }
  } catch(e) {
    document.getElementById('boxes').innerHTML = 'Error: ' + e.message;
  }
}
load();
</script>
<script src="/cbox-files/activate.js"></script>
<script src="/cbox-files/cbox-bridge.js"></script>
</body>
</html>
