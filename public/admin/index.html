<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>صناديق بريدي - NexusBox</title>
<link rel="stylesheet" href="/assets/css/admin-theme.css">
</head>
<body>
<div id="successMsg" class="success-msg"></div>
<div class="main-container">
  <div class="content-section">
    <h1>صناديق البريد الخاصة بك</h1>
    <div style="margin:20px 0;">
      <a href="/admin/create-box.html" class="btn btn-primary">+ إنشاء صندوق جديد</a>
    </div>
    <div id="boxesList">
      <p style="text-align:center; padding:40px; color:#888;">جاري التحميل...</p>
    </div>
  </div>
</div>
<script src="/assets/js/shared.js"></script>
<script>
SHARED.init('');
const API = SHARED.API;
const TOKEN = localStorage.getItem('token');

window.addEventListener('DOMContentLoaded', async () => {
  if (!TOKEN) { window.location.href = '/test.html'; return; }
  await loadBoxes();
});

async function loadBoxes() {
  try {
    const res = await fetch(API + '/api/boxes', { headers: { 'Authorization': 'Bearer ' + TOKEN } });
    const data = await res.json();
    const container = document.getElementById('boxesList');
    
    if (!data.success || data.boxes.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:60px; background:#f8f9fa; border-radius:10px;"><h2>لا توجد صناديق بعد</h2><p style="margin:15px 0;">أنشئ أول صندوق بريد إلكتروني لك الآن</p><a href="/admin/create-box.html" class="btn btn-primary">إنشاء صندوق جديد</a></div>';
      return;
    }
    
    let html = '<div style="display:grid; gap:20px;">';
    data.boxes.forEach(box => {
      html += '<div class="box-item">';
      html += '<h3>' + box.name + '</h3>';
      html += '<p><strong>Slug:</strong> ' + box.slug + '</p>';
      html += '<p><strong>Embed Key:</strong> ' + box.embedKey + '</p>';
      html += '<p><strong>الحالة:</strong> ' + (box.status === 'active' ? 'نشط' : box.status) + '</p>';
      html += '<p><strong>تاريخ الإنشاء:</strong> ' + new Date(box.createdAt).toLocaleDateString('ar') + '</p>';
      html += '<div style="margin-top:15px; display:flex; gap:10px; flex-wrap:wrap;">';
      html += '<a href="/admin/publish.html?key=' + box.embedKey + '" class="btn btn-primary">كود التضمين</a>';
      html += '<a href="/embed.html?key=' + box.embedKey + '" class="btn btn-success" target="_blank">معاينة</a>';
      html += '<a href="/admin/lookfeel.html" class="btn btn-secondary">تعديل المظهر</a>';
      html += '</div></div>';
    });
    html += '</div>';
    container.innerHTML = html;
  } catch(e) {
    document.getElementById('boxesList').innerHTML = '<p style="color:red;">خطأ في التحميل</p>';
  }
}
</script>
</body>
</html>
