<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>القنوات - NexusBox</title>
<link rel="stylesheet" href="/assets/css/admin-theme.css">
</head>
<body>
<div id="successMsg" class="success-msg"></div>
<div class="main-container">
  <div class="content-section">
    <h1>📺 القنوات</h1>
    <div class="sub-nav">
      <a href="/admin/messages.html">الرسائل</a>
      <a href="/admin/messages-archive.html">الأرشيف</a>
      <a href="/admin/messages-sticky.html">الرسائل اللاصقة</a>
      <a href="/admin/messages-channels.html" class="active">القنوات</a>
      <a href="/admin/messages-weblinks.html">روابط الويب</a>
    </div>
    <div class="form-group">
      <label>اختر الصندوق:</label>
      <select id="boxSelect" onchange="loadChannels()">
        <option value="">-- اختر --</option>
      </select>
    </div>
    <div class="form-group">
      <label>اسم القناة الجديدة:</label>
      <input type="text" id="channelName" placeholder="اسم القناة">
      <button class="btn btn-primary" onclick="createChannel()" style="margin-top:10px;">إنشاء قناة</button>
    </div>
    <div id="channelsList" style="padding:20px; color:#888; text-align:center;">اختر صندوق</div>
  </div>
</div>
<script src="/assets/js/shared.js"></script>
<script>
SHARED.init('messages');
const API = SHARED.API;
const TOKEN = localStorage.getItem('token');

window.addEventListener('DOMContentLoaded', async () => {
  if (!TOKEN) { window.location.href = '/test.html'; return; }
  const res = await fetch(API + '/api/boxes', { headers: { 'Authorization': 'Bearer ' + TOKEN } });
  const data = await res.json();
  const select = document.getElementById('boxSelect');
  if (data.success) {
    select.innerHTML = '<option value="">-- اختر --</option>';
    data.boxes.forEach(b => { select.innerHTML += `<option value="${b._id}">${b.name}</option>`; });
  }
});

async function loadChannels() {
  const boxId = document.getElementById('boxSelect').value;
  if (!boxId) return;
  const container = document.getElementById('channelsList');
  container.innerHTML = 'جاري التحميل...';
  try {
    const res = await fetch(API + '/api/boxes/' + boxId + '/channels', {
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    });
    const data = await res.json();
    if (data.success && data.channels && data.channels.length > 0) {
      let html = '<table class="data-table"><thead><tr><th>الاسم</th><th>الوصف</th><th>إجراءات</th></tr></thead><tbody>';
      data.channels.forEach(c => {
        html += `<tr><td>${c.name}</td><td>${c.description || '-'}</td><td><button class="btn btn-danger btn-sm" onclick="deleteChannel('${c._id}', '${boxId}')">حذف</button></td></tr>`;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    } else {
      container.innerHTML = '<p style="text-align:center; padding:20px;">لا توجد قنوات</p>';
    }
  } catch(e) { container.innerHTML = 'خطأ'; }
}

async function createChannel() {
  const boxId = document.getElementById('boxSelect').value;
  const name = document.getElementById('channelName').value;
  if (!boxId || !name) { alert('املأ جميع الحقول'); return; }
  try {
    const res = await fetch(API + '/api/boxes/' + boxId + '/channels', {
      method: 'POST',
      headers: SHARED.getAuthHeaders(),
      body: JSON.stringify({ name })
    });
    const data = await res.json();
    if (data.success) {
      SHARED.showSuccess('تم إنشاء القناة');
      document.getElementById('channelName').value = '';
      loadChannels();
    } else { SHARED.showError(data.error); }
  } catch(e) { SHARED.showError('خطأ'); }
}

async function deleteChannel(id, boxId) {
  if (!confirm('حذف القناة؟')) return;
  await fetch(API + '/api/channels/' + id, { method: 'DELETE', headers: SHARED.getAuthHeaders() });
  loadChannels();
}
</script>
</body>
</html>
