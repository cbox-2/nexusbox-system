<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الرسائل اللاصقة - NexusBox</title>
<link rel="stylesheet" href="/assets/css/admin-theme.css">
</head>
<body>
<div id="successMsg" class="success-msg"></div>
<div class="main-container">
  <div class="content-section">
    <h1> الرسائل اللاصقة</h1>
    <div class="sub-nav">
      <a href="/admin/messages.html">الرسائل</a>
      <a href="/admin/messages-archive.html">الأرشيف</a>
      <a href="/admin/messages-sticky.html" class="active">الرسائل اللاصقة</a>
      <a href="/admin/messages-channels.html">القنوات</a>
      <a href="/admin/messages-weblinks.html">روابط الويب</a>
    </div>
    <div class="form-group">
      <label>اختر الصندوق:</label>
      <select id="boxSelect" onchange="loadSticky()">
        <option value="">-- اختر --</option>
      </select>
    </div>
    <div class="form-group">
      <label>إنشاء رسالة لاصقة جديدة:</label>
      <textarea id="stickyContent" rows="3" placeholder="محتوى الرسالة..."></textarea>
      <button class="btn btn-primary" onclick="createSticky()" style="margin-top:10px;">إنشاء</button>
    </div>
    <div id="stickyList" style="padding:20px; color:#888; text-align:center;">اختر صندوق</div>
  </div>
</div>
<script src="/assets/js/shared.js"></script>
<script>
SHARED.init('messages');
const API = SHARED.API;
const TOKEN = localStorage.getItem('token');

window.addEventListener('DOMContentLoaded', async () => {
  if (!TOKEN) { window.location.href = '/test.html'; return; }
  const res = await fetch(API + '/api/boxes', { headers: { 'Authorization': 'Bearer ' + TOKEN } });
  const data = await res.json();
  const select = document.getElementById('boxSelect');
  if (data.success) {
    select.innerHTML = '<option value="">-- اختر --</option>';
    data.boxes.forEach(b => { select.innerHTML += `<option value="${b._id}">${b.name}</option>`; });
  }
});

async function loadSticky() {
  const boxId = document.getElementById('boxSelect').value;
  if (!boxId) return;
  const container = document.getElementById('stickyList');
  container.innerHTML = 'جاري التحميل...';
  try {
    const res = await fetch(API + '/api/boxes/' + boxId + '/messages?sticky=true', {
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    });
    const data = await res.json();
    if (data.success && data.messages && data.messages.length > 0) {
      let html = '<table class="data-table"><thead><tr><th>المحتوى</th><th>إجراءات</th></tr></thead><tbody>';
      data.messages.forEach(m => {
        html += `<tr><td>${m.content}</td><td><button class="btn btn-danger btn-sm" onclick="deleteMsg('${m._id}')">حذف</button></td></tr>`;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    } else {
      container.innerHTML = '<p style="text-align:center; padding:20px;">لا توجد رسائل لاصقة</p>';
    }
  } catch(e) { container.innerHTML = 'خطأ'; }
}

async function createSticky() {
  const boxId = document.getElementById('boxSelect').value;
  const content = document.getElementById('stickyContent').value;
  if (!boxId || !content) { alert('املأ جميع الحقول'); return; }
  try {
    const res = await fetch(API + '/api/boxes/' + boxId + '/messages', {
      method: 'POST',
      headers: SHARED.getAuthHeaders(),
      body: JSON.stringify({ content, isSticky: true })
    });
    const data = await res.json();
    if (data.success) {
      SHARED.showSuccess('تم الإنشاء');
      document.getElementById('stickyContent').value = '';
      loadSticky();
    } else { SHARED.showError(data.error); }
  } catch(e) { SHARED.showError('خطأ'); }
}

async function deleteMsg(id) {
  if (!confirm('حذف؟')) return;
  await fetch(API + '/api/messages/' + id, { method: 'DELETE', headers: SHARED.getAuthHeaders() });
  loadSticky();
}
</script>
</body>
</html>
