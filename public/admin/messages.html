<!DOCTYPE html>
<html lang="en">
<head>
<title>Messages · NexusBox</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta content="width=device-width, initial-scale=1" name="viewport">
<link rel="stylesheet" href="/cbox-files/style.css">
<script src="/cbox-files/code.js"></script>
</head>
<body id="mainbody">

<div id="mask"></div>

<div id="bodywrap">
  <div id="header">
    <div class="wrap">
      <a id="logo" href="/">
        <img src="/cbox-files/logo400.png" alt="NexusBox" width="200" height="86" border="0">
      </a>
      <div id="headerExtras">
        <span id="userWelcome">user@example.com</span>
        <a href="/admin/index.html">My Cboxes</a>
        <a href="/admin/account.html">My Account</a>
        <a href="/admin/support.html">Support</a>
        <a href="#" onclick="logout()">Log out</a>
      </div>
    </div>
  </div>

  <div id="subbar">
    <div class="wrap">
      <a href="/admin/index.html" class="submenuitem"><b>MYBOX</b></a>
      <a href="/admin/publish.html" class="submenuitem">Publish</a>
      <a href="#" id="hovmenu1" class="submenuitem" onmousedown="return hovmenu(this, 1)">Look &amp; feel</a>
      <a href="#" id="hovmenu2" class="submenuitem" onmousedown="return hovmenu(this, 2)">Options</a>
      <a href="#" id="hovmenu3" class="submenuitem" onmousedown="return hovmenu(this, 3)">Users</a>
      <a href="#" id="hovmenu4" class="submenuitem" onmousedown="return hovmenu(this, 4)">Messages</a>
    </div>
  </div>

  <div id="bar3">
    <div id="hovmenu" class="wrap"><a></a></div>
  </div>

  <div id="main" class="wrap">
    <div id="content">
      <h1>Messages</h1>
      
      <div class="block_grey">
        <form id="msgForm">
          <fieldset>
            <label>Email notification:</label>
            <input type="checkbox" name="emlnotify" value="1">
            
            <input type="submit" name="sub" value=" Save">
            <div id="m_msgForm" class="frmmsg1"></div>
          </fieldset>
        </form>
      </div>

      <h2>Prune messages</h2>
      <div class="block_grey">
        <form id="pruneForm">
          <fieldset>
            <label>Delete oldest:</label>
            <input type="text" name="prunenum" value="150" class="txtbox" style="width:100px;">
            <input type="submit" name="sub" value="Delete" class="Danger">
            <div id="m_pruneForm" class="frmmsg1"></div>
          </fieldset>
        </form>
      </div>

      <h2>Search messages</h2>
      <div class="block_grey">
        <form id="searchForm">
          <fieldset>
            <label>Search:</label>
            <input type="text" name="srch" class="txtbox" style="width:300px;">
            <input type="submit" name="find" value=" Find">
          </fieldset>
        </form>
      </div>

      <div id="messagesList" style="margin-top:20px;">
        <p>Loading messages...</p>
      </div>

    </div>
  </div>

  <div id="footer">
    <a href="/">Home</a>
    <a href="/admin/support.html">Support</a>
    <div class="verybottom">&copy; 2026 NexusBox</div>
  </div>
</div>

<script>
const API = window.location.origin;
const TOKEN = localStorage.getItem('token');

// Load user info
fetch(API + '/api/auth/me', { headers: { 'Authorization': 'Bearer ' + TOKEN } })
  .then(r => r.json())
  .then(d => {
    if (d.success && d.user) {
      document.getElementById('userWelcome').textContent = d.user.email;
    }
  });

// Load messages
const boxId = localStorage.getItem('currentBoxId');
if (boxId) {
  fetch(API + '/api/boxes/' + boxId + '/messages', {
    headers: { 'Authorization': 'Bearer ' + TOKEN }
  })
  .then(r => r.json())
  .then(d => {
    if (d.success && d.messages) {
      let html = '<table><thead><tr><th>Message</th><th>Author</th><th>Date</th><th>Actions</th></tr></thead><tbody>';
      d.messages.forEach(m => {
        html += `<tr>
          <td>${m.content.substring(0, 100)}</td>
          <td>${m.author?.username || 'Guest'}</td>
          <td>${new Date(m.createdAt).toLocaleString()}</td>
          <td><input type="button" value="Delete" onclick="deleteMsg('${m._id}')" class="Danger"></td>
        </tr>`;
      });
      html += '</tbody></table>';
      document.getElementById('messagesList').innerHTML = html;
    }
  });
}

function deleteMsg(id) {
  if (!confirm('Delete this message?')) return;
  fetch(API + '/api/messages/' + id, {
    method: 'DELETE',
    headers: { 'Authorization': 'Bearer ' + TOKEN }
  })
  .then(r => r.json())
  .then(d => {
    if (d.success) location.reload();
  });
}

function logout() {
  localStorage.removeItem('token');
  window.location.href = '/';
}
</script>

</body>
</html>
