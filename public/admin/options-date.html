<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>خيارات التاريخ - NexusBox</title>
<link rel="stylesheet" href="/assets/css/admin-theme.css">
</head>
<body>
<div id="successMsg" class="success-msg"></div>
<div class="main-container">
  <div class="content-section">
    <h1> خيارات التاريخ</h1>
    <div class="sub-nav">
      <a href="/admin/options.html">خيارات النشر</a>
      <a href="/admin/options-date.html" class="active">خيارات التاريخ</a>
      <a href="/admin/options-emoji.html">الرموز التعبيرية</a>
      <a href="/admin/options-filter.html">التصفية</a>
    </div>
    <div class="form-group">
      <label>تنسيق التاريخ:</label>
      <select id="dateFormat">
        <option value="DD/MM/YYYY">يوم/شهر/سنة</option>
        <option value="MM/DD/YYYY">شهر/يوم/سنة</option>
        <option value="YYYY-MM-DD">سنة-شهر-يوم</option>
      </select>
    </div>
    <div class="form-group">
      <label>تنسيق الوقت:</label>
      <select id="timeFormat">
        <option value="24h">24 ساعة</option>
        <option value="12h">12 ساعة (AM/PM)</option>
      </select>
    </div>
    <div class="form-group">
      <label>المنطقة الزمنية:</label>
      <select id="timezone">
        <option value="Asia/Baghdad">بغداد (UTC+3)</option>
        <option value="Asia/Riyadh">الرياض (UTC+3)</option>
        <option value="Asia/Dubai">دبي (UTC+4)</option>
        <option value="UTC">UTC</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="saveDateSettings()">حفظ</button>
  </div>
</div>
<script src="/assets/js/shared.js"></script>
<script>
SHARED.init('options');
const API = SHARED.API;
const TOKEN = localStorage.getItem('token');

async function saveDateSettings() {
  try {
    const res = await fetch(API + '/api/settings/date', {
      method: 'POST',
      headers: SHARED.getAuthHeaders(),
      body: JSON.stringify({
        dateFormat: document.getElementById('dateFormat').value,
        timeFormat: document.getElementById('timeFormat').value,
        timezone: document.getElementById('timezone').value
      })
    });
    const data = await res.json();
    if (data.success) SHARED.showSuccess('تم الحفظ');
    else SHARED.showError(data.error);
  } catch(e) { SHARED.showError('خطأ'); }
}
</script>
</body>
</html>
