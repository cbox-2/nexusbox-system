<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الرموز التعبيرية - NexusBox</title>
<link rel="stylesheet" href="/assets/css/admin-theme.css">
</head>
<body>
<div id="successMsg" class="success-msg"></div>
<div class="main-container">
  <div class="content-section">
    <h1>😊 الرموز التعبيرية</h1>
    <div class="sub-nav">
      <a href="/admin/options.html">خيارات النشر</a>
      <a href="/admin/options-date.html">خيارات التاريخ</a>
      <a href="/admin/options-emoji.html" class="active">الرموز التعبيرية</a>
      <a href="/admin/options-filter.html">التصفية</a>
    </div>
    <div class="toggle-group">
      <div><strong>تفعيل الرموز التعبيرية</strong><small>السماح باستخدام الإيموجي</small></div>
      <label class="toggle"><input type="checkbox" id="emojiEnabled" checked><span class="slider"></span></label>
    </div>
    <div class="form-group">
      <label>الرموز المسموحة (افصل بفاصلة):</label>
      <textarea id="allowedEmojis" rows="4" placeholder="😀, 😂, ❤️, 👍">😀, 😂, 😍, 😎, , ❤️, 👍, 👏, 🔥, ✨</textarea>
    </div>
    <button class="btn btn-primary" onclick="saveEmoji()">حفظ</button>
  </div>
</div>
<script src="/assets/js/shared.js"></script>
<script>
SHARED.init('options');
const API = SHARED.API;
const TOKEN = localStorage.getItem('token');

async function saveEmoji() {
  try {
    const res = await fetch(API + '/api/settings/emoji', {
      method: 'POST',
      headers: SHARED.getAuthHeaders(),
      body: JSON.stringify({
        enabled: document.getElementById('emojiEnabled').checked,
        allowed: document.getElementById('allowedEmojis').value.split(',').map(s => s.trim())
      })
    });
    const data = await res.json();
    if (data.success) SHARED.showSuccess('تم الحفظ');
  } catch(e) { SHARED.showError('خطأ'); }
}
</script>
</body>
</html>
