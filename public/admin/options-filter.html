<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>التصفية - NexusBox</title>
<link rel="stylesheet" href="/assets/css/admin-theme.css">
</head>
<body>
<div id="successMsg" class="success-msg"></div>
<div class="main-container">
  <div class="content-section">
    <h1>🔍 التصفية والفلترة</h1>
    <div class="sub-nav">
      <a href="/admin/options.html">خيارات النشر</a>
      <a href="/admin/options-date.html">خيارات التاريخ</a>
      <a href="/admin/options-emoji.html">الرموز التعبيرية</a>
      <a href="/admin/options-filter.html" class="active">التصفية</a>
    </div>
    <div class="form-group">
      <label>الكلمات الممنوعة (كل كلمة في سطر):</label>
      <textarea id="bannedWords" rows="5" placeholder="كلمة1&#10;كلمة2"></textarea>
    </div>
    <div class="toggle-group">
      <div><strong>فلترة الروابط</strong><small>منع إرسال الروابط</small></div>
      <label class="toggle"><input type="checkbox" id="filterLinks"><span class="slider"></span></label>
    </div>
    <div class="toggle-group">
      <div><strong>فلترة الرسائل المتكررة</strong><small>منع السبام</small></div>
      <label class="toggle"><input type="checkbox" id="filterSpam" checked><span class="slider"></span></label>
    </div>
    <button class="btn btn-primary" onclick="saveFilter()">حفظ</button>
  </div>
</div>
<script src="/assets/js/shared.js"></script>
<script>
SHARED.init('options');
const API = SHARED.API;
const TOKEN = localStorage.getItem('token');

async function saveFilter() {
  try {
    const res = await fetch(API + '/api/settings/filter', {
      method: 'POST',
      headers: SHARED.getAuthHeaders(),
      body: JSON.stringify({
        bannedWords: document.getElementById('bannedWords').value.split('\n').filter(s => s.trim()),
        filterLinks: document.getElementById('filterLinks').checked,
        filterSpam: document.getElementById('filterSpam').checked
      })
    });
    const data = await res.json();
    if (data.success) SHARED.showSuccess('تم الحفظ');
  } catch(e) { SHARED.showError('خطأ'); }
}
</script>
</body>
</html>
