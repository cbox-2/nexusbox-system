<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الخيارات - NexusBox</title>
<link rel="stylesheet" href="/assets/css/admin-theme.css">
</head>
<body>
<div id="successMsg" class="success-msg"></div>
<div class="main-container">
  <div class="content-section">
    <h1>⚙️ الخيارات</h1>
    <div class="sub-nav">
      <a href="/admin/options.html" class="active">خيارات النشر</a>
      <a href="/admin/options-date.html">خيارات التاريخ</a>
      <a href="/admin/options-emoji.html">الرموز التعبيرية</a>
      <a href="/admin/options-filter.html">التصفية</a>
    </div>
    <div class="form-group">
      <label>اختر الصندوق:</label>
      <select id="boxSelect" onchange="loadSettings()">
        <option value="">-- اختر --</option>
      </select>
    </div>
    <div class="toggle-group">
      <div><strong>السماح للزوار</strong><small>السماح للزوار غير المسجلين</small></div>
      <label class="toggle"><input type="checkbox" id="allowGuest" onchange="saveSetting('allowGuestPost', this.checked)"><span class="slider"></span></label>
    </div>
    <div class="toggle-group">
      <div><strong>التسجيل الذاتي</strong><small>السماح بالتسجيل الذاتي</small></div>
      <label class="toggle"><input type="checkbox" id="selfReg" onchange="saveSetting('selfRegistration', this.checked)"><span class="slider"></span></label>
    </div>
    <div class="toggle-group">
      <div><strong>حذف آخر رسالة</strong><small>السماح للمستخدم بحذف آخر رسالة</small></div>
      <label class="toggle"><input type="checkbox" id="lastPost" onchange="saveSetting('lastPostDelete', this.checked)"><span class="slider"></span></label>
    </div>
    <div class="form-group">
      <label>عدد الرسائل في الصفحة:</label>
      <input type="number" id="msgsPerPage" value="20" onchange="saveSetting('messagesPerPage', parseInt(this.value))">
    </div>
    <div class="form-group">
      <label>اتجاه الفرز:</label>
      <select id="sortDir" onchange="saveSetting('sortDirection', parseInt(this.value))">
        <option value="1">الأحدث أولاً</option>
        <option value="-1">الأقدم أولاً</option>
      </select>
    </div>
  </div>
</div>
<script src="/assets/js/shared.js"></script>
<script>
SHARED.init('options');
const API = SHARED.API;
const TOKEN = localStorage.getItem('token');
let currentBoxId = null;

window.addEventListener('DOMContentLoaded', async () => {
  if (!TOKEN) { window.location.href = '/test.html'; return; }
  const res = await fetch(API + '/api/boxes', { headers: { 'Authorization': 'Bearer ' + TOKEN } });
  const data = await res.json();
  const select = document.getElementById('boxSelect');
  if (data.success) {
    select.innerHTML = '<option value="">-- اختر --</option>';
    data.boxes.forEach(b => { select.innerHTML += `<option value="${b._id}">${b.name}</option>`; });
  }
});

async function loadSettings() {
  const boxId = document.getElementById('boxSelect').value;
  if (!boxId) return;
  currentBoxId = boxId;
  try {
    const res = await fetch(API + '/api/boxes/' + boxId, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
    const data = await res.json();
    if (data.success && data.box) {
      const s = data.box.settings || {};
      document.getElementById('allowGuest').checked = s.allowGuestPost !== false;
      document.getElementById('selfReg').checked = s.selfRegistration !== false;
      document.getElementById('lastPost').checked = s.lastPostDelete || false;
      document.getElementById('msgsPerPage').value = s.messagesPerPage || 20;
      document.getElementById('sortDir').value = s.sortDirection || 1;
    }
  } catch(e) {}
}

async function saveSetting(key, value) {
  if (!currentBoxId) return;
  try {
    await fetch(API + '/api/boxes/' + currentBoxId, {
      method: 'PUT',
      headers: SHARED.getAuthHeaders(),
      body: JSON.stringify({ settings: { [key]: value } })
    });
    SHARED.showSuccess('تم الحفظ');
  } catch(e) { SHARED.showError('خطأ'); }
}
</script>
</body>
</html>
