<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الدعم - NexusBox</title>
<link rel="stylesheet" href="/assets/css/admin-theme.css">
</head>
<body>
<div class="main-container">
  <div class="content-section">
    <h1>💬 الدعم</h1>
    <div class="info-msg">
      <h3>تواصل معنا</h3>
      <p>للحصول على المساعدة، يمكنك:</p>
      <ul style="padding-right:20px; line-height:2;">
        <li>البريد: support@nexusbox.com</li>
        <li>الوثائق: <a href="/api/health">API Docs</a></li>
        <li>GitHub: <a href="https://github.com/cbox-2/nexusbox-system" target="_blank">المستودع</a></li>
      </ul>
    </div>
    <div class="form-group">
      <label>أرسل رسالة دعم:</label>
      <textarea id="supportMsg" rows="5" placeholder="اكتب رسالتك..."></textarea>
      <button class="btn btn-primary" onclick="sendSupport()" style="margin-top:10px;">إرسال</button>
    </div>
  </div>
</div>
<script src="/assets/js/shared.js"></script>
<script>
SHARED.init('');
function sendSupport() {
  const msg = document.getElementById('supportMsg').value;
  if (!msg) { alert('اكتب رسالة'); return; }
  alert('تم إرسال رسالتك. سنرد عليك قريباً.');
  document.getElementById('supportMsg').value = '';
}
</script>
<script src="/cbox-files/activate.js"></script>
</body>
</html>
