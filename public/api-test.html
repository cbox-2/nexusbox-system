<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>API Tester - NexusBox v2.0</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; color: #fff; }
.container { max-width: 900px; margin: 0 auto; }
h1 { text-align: center; margin-bottom: 30px; font-size: 32px; }
.card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 15px; padding: 25px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.2); }
h2 { margin-bottom: 15px; color: #fff; font-size: 20px; }
label { display: block; margin: 10px 0 5px; font-size: 14px; }
input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.9); color: #333; font-size: 14px; margin-bottom: 10px; }
button { background: linear-gradient(135deg, #48bb78 0%, #38a169 100%); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; margin: 5px 5px 5px 0; transition: transform 0.2s; }
button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
button.danger { background: linear-gradient(135deg, #f56565 0%, #c53030 100%); }
button.secondary { background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%); }
.result { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 8px; margin-top: 15px; font-family: 'Courier New', monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto; color: #6bff6b; }
.token-box { background: rgba(255,255,255,0.95); color: #333; padding: 10px; border-radius: 8px; font-size: 11px; word-break: break-all; margin-top: 10px; }
.status { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; margin-left: 10px; }
.status.ok { background: #48bb78; }
.status.err { background: #f56565; }
</style>
</head>
<body>
<div class="container">
  <h1>🧪 NexusBox API Tester v2.0</h1>
  
  <div class="card">
    <h2>1️⃣ إنشاء حساب جديد</h2>
    <label>Username:</label>
    <input type="text" id="signup-username" value="testuser">
    <label>Email:</label>
    <input type="email" id="signup-email" value="test@example.com">
    <label>Password:</label>
    <input type="password" id="signup-password" value="test123456">
    <button onclick="signup()">إنشاء الحساب</button>
    <div id="signup-result" class="result" style="display:none"></div>
  </div>

  <div class="card">
    <h2>2️⃣ تسجيل الدخول</h2>
    <label>Username or Email:</label>
    <input type="text" id="login-username" value="testuser">
    <label>Password:</label>
    <input type="password" id="login-password" value="test123456">
    <button onclick="login()">تسجيل الدخول</button>
    <div id="login-result" class="result" style="display:none"></div>
    <div id="token-display" class="token-box" style="display:none"></div>
  </div>

  <div class="card">
    <h2>3️⃣ معلومات المستخدم الحالي</h2>
    <button onclick="getMe()">جلب معلوماتي</button>
    <div id="me-result" class="result" style="display:none"></div>
  </div>

  <div class="card">
    <h2>4️⃣ إنشاء Box جديد</h2>
    <label>Box Name:</label>
    <input type="text" id="box-name" value="My First Box">
    <label>Primary Color:</label>
    <input type="color" id="box-color" value="#667eea">
    <button onclick="createBox()">إنشاء Box</button>
    <div id="box-result" class="result" style="display:none"></div>
  </div>

  <div class="card">
    <h2>5️⃣ قائمة كل Boxes</h2>
    <button onclick="listBoxes()">جلب كل Boxes</button>
    <div id="list-result" class="result" style="display:none"></div>
  </div>

  <div class="card">
    <h2>6️⃣ جلب Box بالمفتاح (Embed)</h2>
    <label>Embed Key:</label>
    <input type="text" id="embed-key" placeholder="paste embed key here">
    <button onclick="getByEmbed()">جلب Box</button>
    <div id="embed-result" class="result" style="display:none"></div>
  </div>
</div>

<script>
const API = window.location.origin;
let TOKEN = '';

function showResult(id, data, isError) {
  const el = document.getElementById(id);
  el.style.display = 'block';
  el.style.color = isError ? '#ff6b6b' : '#6bff6b';
  el.textContent = JSON.stringify(data, null, 2);
}

async function signup() {
  try {
    const res = await fetch(API + '/api/auth/signup', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('signup-username').value,
        email: document.getElementById('signup-email').value,
        password: document.getElementById('signup-password').value
      })
    });
    const data = await res.json();
    showResult('signup-result', data, !data.success);
    if (data.token) {
      TOKEN = data.token;
      localStorage.setItem('token', TOKEN);
      document.getElementById('token-display').style.display = 'block';
      document.getElementById('token-display').textContent = '🔑 Token: ' + TOKEN;
    }
  } catch(e) {
    showResult('signup-result', {error: e.message}, true);
  }
}

async function login() {
  try {
    const res = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('login-username').value,
        password: document.getElementById('login-password').value
      })
    });
    const data = await res.json();
    showResult('login-result', data, !data.success);
    if (data.token) {
      TOKEN = data.token;
      localStorage.setItem('token', TOKEN);
      document.getElementById('token-display').style.display = 'block';
      document.getElementById('token-display').textContent = '🔑 Token: ' + TOKEN;
    }
  } catch(e) {
    showResult('login-result', {error: e.message}, true);
  }
}

async function getMe() {
  if (!TOKEN) return alert('سجل دخول أولاً!');
  try {
    const res = await fetch(API + '/api/auth/me', {
      headers: {'Authorization': 'Bearer ' + TOKEN}
    });
    const data = await res.json();
    showResult('me-result', data, !data.success);
  } catch(e) {
    showResult('me-result', {error: e.message}, true);
  }
}

async function createBox() {
  if (!TOKEN) return alert('سجل دخول أولاً!');
  try {
    const res = await fetch(API + '/api/boxes', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + TOKEN
      },
      body: JSON.stringify({
        name: document.getElementById('box-name').value,
        theme: { primaryColor: document.getElementById('box-color').value }
      })
    });
    const data = await res.json();
    showResult('box-result', data, !data.success);
    if (data.box && data.box.embedKey) {
      document.getElementById('embed-key').value = data.box.embedKey;
    }
  } catch(e) {
    showResult('box-result', {error: e.message}, true);
  }
}

async function listBoxes() {
  if (!TOKEN) return alert('سجل دخول أولاً!');
  try {
    const res = await fetch(API + '/api/boxes', {
      headers: {'Authorization': 'Bearer ' + TOKEN}
    });
    const data = await res.json();
    showResult('list-result', data, !data.success);
  } catch(e) {
    showResult('list-result', {error: e.message}, true);
  }
}

async function getByEmbed() {
  const key = document.getElementById('embed-key').value;
  if (!key) return alert('أدخل Embed Key');
  try {
    const res = await fetch(API + '/api/embed/' + key);
    const data = await res.json();
    showResult('embed-result', data, !data.success);
  } catch(e) {
    showResult('embed-result', {error: e.message}, true);
  }
}

// Load token from localStorage
window.addEventListener('load', () => {
  const saved = localStorage.getItem('token');
  if (saved) {
    TOKEN = saved;
    document.getElementById('token-display').style.display = 'block';
    document.getElementById('token-display').textContent = '🔑 Token: ' + TOKEN;
  }
});
</script>
</body>
</html>
