<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>القنوات · NexusBox</title>
<link rel="stylesheet" href="style.css">
<style>
body { background-color: #1e1b4b !important; padding-top: 20px !important; color: white; }
.channel-list { margin-top: 20px; }
.channel-item {
  background: rgba(255,255,255,0.1);
  padding: 15px;
  margin-bottom: 10px;
  border-radius: 8px;
  border-right: 4px solid #4a7fb5;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.channel-info { flex: 1; }
.channel-actions { display: flex; gap: 10px; }
.btn {
  padding: 8px 15px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 13px;
}
.btn-delete { background: #dc3545; color: white; }
.btn:hover { opacity: 0.8; }
.add-channel-form {
  background: rgba(255,255,255,0.1);
  padding: 20px;
  border-radius: 8px;
  margin-bottom: 20px;
}
.form-group { margin-bottom: 15px; }
.form-group label { display: block; margin-bottom: 5px; }
.form-group input, .form-group textarea {
  width: 100%;
  padding: 10px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 5px;
  color: white;
}
.form-group textarea { min-height: 80px; resize: vertical; }
</style>
</head>
<body>

<div id="main">
  <h1>القنوات</h1>
  <p>إدارة قنوات الدردشة</p>
  
  <div class="add-channel-form">
    <h3>إنشاء قناة جديدة</h3>
    <form id="add-channel-form">
      <div class="form-group">
        <label>اسم القناة</label>
        <input type="text" id="channel-name" required>
      </div>
      <div class="form-group">
        <label>الوصف</label>
        <textarea id="channel-description"></textarea>
      </div>
      <button type="submit" class="btn btn-edit">إنشاء قناة</button>
    </form>
  </div>
  
  <div class="channel-list" id="channel-list">
    <p>جاري تحميل القنوات...</p>
  </div>
</div>

<script src="code.js"></script>
<script>
const token = localStorage.getItem('token');

// تحميل القنوات
async function loadChannels() {
  try {
    const res = await fetch('/api/channels', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await res.json();
    
    if (data.success) {
      const channelList = document.getElementById('channel-list');
      channelList.innerHTML = '';
      
      if (data.channels.length === 0) {
        channelList.innerHTML = '<p>لا توجد قنوات حالياً</p>';
        return;
      }
      
      data.channels.forEach(channel => {
        const channelItem = document.createElement('div');
        channelItem.className = 'channel-item';
        channelItem.innerHTML = `
          <div class="channel-info">
            <strong>${channel.name}</strong>
            <br>
            <small>${channel.description || 'لا يوجد وصف'}</small>
            <br>
            <small>بواسطة: ${channel.createdBy?.username || 'Unknown'} | ${new Date(channel.createdAt).toLocaleString('ar')}</small>
          </div>
          <div class="channel-actions">
            <button class="btn btn-delete" onclick="deleteChannel('${channel._id}')">حذف</button>
          </div>
        `;
        channelList.appendChild(channelItem);
      });
    }
  } catch (error) {
    console.error('Error loading channels:', error);
  }
}

// إنشاء قناة
document.getElementById('add-channel-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const name = document.getElementById('channel-name').value;
  const description = document.getElementById('channel-description').value;
  
  try {
    const res = await fetch('/api/channels', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({ name, description })
    });
    
    const data = await res.json();
    
    if (data.success) {
      alert('تم إنشاء القناة!');
      loadChannels();
      this.reset();
    } else {
      alert('خطأ: ' + data.error);
    }
  } catch (error) {
    alert('خطأ في الاتصال');
  }
});

// حذف قناة
async function deleteChannel(channelId) {
  if (!confirm('هل أنت متأكد من حذف هذه القناة؟')) return;
  
  try {
    const res = await fetch(`/api/channels/${channelId}`, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    
    const data = await res.json();
    
    if (data.success) {
      loadChannels();
    }
  } catch (error) {
    alert('خطأ في الاتصال');
  }
}

// تحميل القنوات عند فتح الصفحة
loadChannels();
</script>
</body>
</html>
