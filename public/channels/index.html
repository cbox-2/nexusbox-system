<h1>📺 Channels</h1>
<p>Create and manage chat channels for your community.</p>

<form id="add-channel-form" onsubmit="return addChannel(event)">
<fieldset>
<legend>Create New Channel</legend>
<label>Channel Name:</label>
<input type="text" id="ch-name" maxlength="50" size="30" class="txtbox" required>
<label>Description:</label>
<input type="text" id="ch-desc" maxlength="200" size="50" class="txtbox">
<input type="submit" value=" Create Channel ">
<div id="m_ch" class="frmmsg1"></div>
<div id="em_ch" class="frmmsg2"></div>
</fieldset>
</form>

<fieldset>
<legend>Existing Channels</legend>
<div id="channel-list" style="background:#fff; min-height:200px; padding:10px;">
<div style="text-align:center; color:#999;">Loading channels...</div>
</div>
</fieldset>

<script src="/shared/auth.js"></script>
<script src="/shared/nav.js"></script>
<script>
async function init() {
  await loadUserInfo();
  loadChannels();
}

async function loadChannels() {
  var token = localStorage.getItem('token');
  var list = document.getElementById('channel-list');
  try {
    var res = await fetch('/api/channels', {headers:{'Authorization':'Bearer '+token}});
    var data = await res.json();
    if (data.success) renderChannels(data.channels);
    else list.innerHTML = '<div style="color:#f66">Error loading</div>';
  } catch(e) { list.innerHTML = '<div style="color:#f66">Connection error</div>'; }
}

function renderChannels(channels) {
  var list = document.getElementById('channel-list');
    list.innerHTML = '<div style="text-align:center; color:#999; padding:20px;">No channels yet. Create your first one!</div>';
    return;
  }
  list.innerHTML = '';
  channels.forEach(function(ch) {
    var row = document.createElement('div');
    row.style.cssText = 'padding:12px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;';
    row.innerHTML = '<div>' +
      '<strong style="color:#059ad0;">#' + escapeHtml(ch.name) + '</strong>' +
      '<div style="color:#666; font-size:11px;">' + escapeHtml(ch.description || 'No description') + '</div>' +
      '<div style="color:#999; font-size:10px;">Created: ' + new Date(ch.createdAt).toLocaleDateString() + '</div>' +
      '</div>' +
      '<div>' +
      '<a href="/chat/chat.html?channel=' + ch.name + '" style="background:#059ad0; color:#fff; padding:5px 10px; text-decoration:none; border-radius:3px; margin-right:5px;">Open</a>' +
      '<button onclick="deleteChannel(''+ch._id+'')" style="background:#dc3545;">Delete</button>' +
      '</div>';
    list.appendChild(row);
  });
}

function escapeHtml(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

async function addChannel(e) {
  e.preventDefault();
  var token = localStorage.getItem('token');
  var msg = document.getElementById('m_ch');
  var err = document.getElementById('em_ch');
  msg.textContent = ''; err.innerHTML = '';
  var name = document.getElementById('ch-name').value.trim();
  var desc = document.getElementById('ch-desc').value.trim();
  try {
    var res = await fetch('/api/channels', {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'Authorization':'Bearer '+token},
      body: JSON.stringify({name: name, description: desc})
    });
    var data = await res.json();
    if (data.success) {
      msg.textContent = 'Channel created!';
      document.getElementById('ch-name').value = '';
      document.getElementById('ch-desc').value = '';
      loadChannels();
    } else {
      err.innerHTML = '<ul><li>' + data.error + '</li></ul>';
    }
  } catch(e) { err.innerHTML = '<ul><li>Connection error</li></ul>'; }
  return false;
}

async function deleteChannel(id) {
  var token = localStorage.getItem('token');
  try {
    var res = await fetch('/api/channels/' + id, {
      method: 'DELETE',
      headers: {'Authorization':'Bearer '+token}
    });
    var data = await res.json();
    if (data.success) loadChannels();
    else alert('Error: ' + data.error);
  } catch(e) { alert('Connection error'); }
}

document.addEventListener('DOMContentLoaded', init);
</script>
