<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دردشة NexusBox</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#f4f7f6;color:#333;display:flex;flex-direction:column;height:100vh}
.header{background:#059ad0;color:#fff;padding:12px;text-align:center;font-weight:bold}
#status{text-align:center;padding:5px;background:#eee;font-size:12px;color:#666}
#messages{flex:1;overflow-y:auto;padding:15px;background:#fafafa;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.4;word-break:break-word}
.msg.self{align-self:flex-end;background:#059ad0;color:#fff;border-bottom-right-radius:2px}
.msg.other{align-self:flex-start;background:#fff;border:1px solid #ddd;border-bottom-left-radius:2px}
.msg b{font-size:11px;opacity:0.8;display:block;margin-bottom:2px}
.input-area{display:flex;padding:10px;background:#fff;border-top:1px solid #eee;gap:8px}
#chatInput{flex:1;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:14px;outline:none}
#sendBtn{background:#059ad0;color:#fff;border:none;padding:0 20px;border-radius:8px;font-weight:bold;cursor:pointer}
#prompt{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center}
.prompt-box{background:#fff;padding:20px;border-radius:10px;width:90%;max-width:300px;text-align:center}
.prompt-box input{width:100%;padding:10px;margin:10px 0;border:1px solid #ccc;border-radius:6px}
.prompt-box button{width:100%;padding:10px;background:#059ad0;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div id="prompt">
  <div class="prompt-box">
    <h3>👋 أدخل اسمك للدخول</h3>
    <input type="text" id="usernameInput" placeholder="اسمك هنا...">
    <button onclick="startChat()">دخول الدردشة</button>
  </div>
</div>

<div class="header">💬 <span id="boxName">NexusBox Chat</span></div>
<div id="status">جاري الاتصال...</div>
<div id="messages"></div>
<div class="input-area">
  <input type="text" id="chatInput" placeholder="اكتب رسالتك...">
  <button id="sendBtn">إرسال</button>
</div>

<script>
let ws, myName;
const boxId = new URLSearchParams(window.location.search).get('box');
if(!boxId) document.getElementById('status').textContent = '⚠️ لم يتم تحديد صندوق';

function startChat(){
  myName = document.getElementById('usernameInput').value.trim();
  if(!myName) return alert('اكتب اسمك أولاً');
  document.getElementById('prompt').style.display='none';
  connectWS();
}

function connectWS(){
  const status = document.getElementById('status');
  const proto = location.protocol==='https:'?'wss:':'ws:';
  ws = new WebSocket(`${proto}//${location.host}/chat?box=${boxId}`);
  ws.onopen = () => { status.textContent='✅ متصل'; status.style.background='#d4edda'; status.style.color='#155724'; };
  ws.onclose = () => { status.textContent='❌ انقطع الاتصال'; status.style.background='#f8d7da'; status.style.color='#721c24'; };
  ws.onmessage = (e) => {
    try{
      const data = JSON.parse(e.data);
      const isSelf = data.name === myName;
      const div = document.createElement('div');
      div.className = `msg ${isSelf?'self':'other'}`;
      div.innerHTML = `<b>${escapeHtml(data.name)}</b>${escapeHtml(data.text)}`;
      document.getElementById('messages').appendChild(div);
      document.getElementById('messages').scrollTop = 999999;
    }catch{}
  };
}

function sendMessage(){
  const inp = document.getElementById('chatInput');
  const text = inp.value.trim();
  if(!text || !ws || ws.readyState!==1) return;
  ws.send(JSON.stringify({name:myName, text}));
  inp.value='';
}
document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('chatInput').addEventListener('keypress', e => { if(e.key==='Enter') sendMessage(); });
function escapeHtml(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
</script>
</body>
</html>
