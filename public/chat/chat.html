<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat · NexusBox</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Tahoma, sans-serif; background: #FFE4E1; }

.chat-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  background: #FFE4E1;
}

.messages-area {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  background: #FFE4E1;
}

.message {
  margin-bottom: 10px;
  padding: 8px;
  background: #FFFAFA;
  border-radius: 5px;
}

.message.user2 {
  background: #FFE4E1;
}

.message .username {
  font-weight: bold;
  color: #141CEE;
  margin-left: 5px;
}

.message .time {
  font-size: 8pt;
  color: #666;
  float: left;
}

.message .text {
  margin-top: 5px;
}

.form-area {
  background: #FFE4E1;
  padding: 10px;
  border-top: 1px solid #ccc;
}

.form-area input {
  width: 85px;
  height: 55px;
  padding: 5px;
  background: Whitesmoke;
  border: #0000FF 2px solid;
  border-radius: 15px;
  font-family: Arial, sans-serif;
  font-size: 15pt;
  margin: 1px;
}

.form-area button {
  border: black 1px solid;
  border-radius: 9px;
  width: 30px;
  height: 50px;
  font-size: 15pt;
  background: #FF0000;
  color: #000000;
  vertical-align: top;
  margin: 1px;
  cursor: pointer;
}

a { color: Deeppink; text-decoration: none; font-size: 14pt; }
a:visited { color: #D80000; }
a:hover { text-decoration: underline; color: #000; }

/* Preview mode - hide header/footer */
body.preview-mode #header,
body.preview-mode #footer {
  display: none;
}

body.preview-mode {
  padding: 0;
  margin: 0;
}
</style>
</head>
<body>

<div class="chat-container">
  <div class="messages-area" id="messages">
    <div class="message user1">
      <span class="time">12:00 PM</span>
      <span class="username">Admin:</span>
      <div class="text">Welcome to NexusBox Chat!</div>
    </div>
    <div class="message user2">
      <span class="time">12:01 PM</span>
      <span class="username">User:</span>
      <div class="text">Hello everyone!</div>
    </div>
    <div class="message user1">
      <span class="time">12:02 PM</span>
      <span class="username">Admin:</span>
      <div class="text">This is a sample message to preview your theme.</div>
    </div>
  </div>
  
  <div class="form-area">
    <input type="text" placeholder="Name">
    <input type="text" placeholder="Message" style="width: 200px;">
    <button>»</button>
  </div>
</div>

<script>
// Check if in preview mode
if (window.location.search.indexOf('preview=') !== -1) {
  document.body.classList.add('preview-mode');
}

// Auto-scroll to bottom
var messagesArea = document.getElementById('messages');
messagesArea.scrollTop = messagesArea.scrollHeight;
</script>

</body>
</html>
