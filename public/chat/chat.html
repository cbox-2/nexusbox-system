<script>
var currentChannel = 'general';
var currentUser = null;
var refreshInterval = null;

async function init() {
  currentUser = await loadUserInfo();
  loadMessages();
  refreshInterval = setInterval(loadMessages, 3000);
}

async function loadMessages() {
  var token = localStorage.getItem('token');
  try {
    var res = await fetch('/api/messages?channel=' + currentChannel, {
      headers: {'Authorization': 'Bearer ' + token}
    });
    var data = await res.json();
    if (data.success) renderMessages(data.messages);
  } catch(e) { console.error(e); }
}

function renderMessages(messages) {
  var container = document.getElementById('chat-messages');
    container.innerHTML = '<div style="text-align:center; color:#999; padding:40px;">No messages yet. Start the conversation!</div>';
    return;
  }
  
  var sorted = messages.slice().sort(function(a,b) {
    return new Date(a.createdAt) - new Date(b.createdAt);
  });
  
  container.innerHTML = '';
  sorted.forEach(function(msg) {
    var div = document.createElement('div');
    div.className = 'chat-msg' + (msg.isSticky ? ' sticky' : '');
    var time = new Date(msg.createdAt).toLocaleTimeString();
    var username = msg.author ? msg.author.username : 'Unknown';
    div.innerHTML = '<span class="time">' + time + '</span>' +
      (msg.isSticky ? '📌 ' : '') +
      '<span class="username">' + escapeHtml(username) + ':</span>' +
      '<div class="text">' + escapeHtml(msg.content) + '</div>';
    container.appendChild(div);
  });
  container.scrollTop = container.scrollHeight;
}

function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

async function sendMessage(e) {
  e.preventDefault();
  var input = document.getElementById('chat-input');
  var content = input.value.trim();
  
  var token = localStorage.getItem('token');
  try {
    var res = await fetch('/api/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'Authorization':'Bearer '+token},
      body: JSON.stringify({content: content, channel: currentChannel})
    });
    var data = await res.json();
    if (data.success) {
      input.value = '';
      loadMessages();
    } else {
      alert('Error: ' + data.error);
    }
  } catch(e) { alert('Connection error'); }
  return false;
}

function switchChannel() {
  currentChannel = document.getElementById('current-channel').value;
  loadMessages();
}

document.addEventListener('DOMContentLoaded', init);
</script>
