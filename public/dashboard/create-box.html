<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إنشاء صندوق تحكم</title>
<style>
body { font-family: Arial; background: #f0f2f5; padding: 20px; }
.container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
h1 { color: #667eea; }
.form-group { margin: 15px 0; }
.form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
.form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
.btn { background: #667eea; color: white; padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
.success { background: #d4edda; padding: 20px; border-radius: 5px; margin: 20px 0; display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>📦 إنشاء صندوق تحكم جديد</h1>
  
  <form onsubmit="createBox(event)">
    <div class="form-group">
      <label>اسم الصندوق:</label>
      <input type="text" id="boxName" required>
    </div>
    
    <div class="form-group">
      <label>العرض:</label>
      <input type="number" id="width" value="400">
    </div>
    
    <div class="form-group">
      <label>الارتفاع:</label>
      <input type="number" id="height" value="500">
    </div>
    
    <button type="submit" class="btn">إنشاء الصندوق</button>
  </form>
  
  <div class="success" id="successBox">
    <h3>✅ تم الإنشاء بنجاح!</h3>
    <p id="result"></p>
  </div>
</div>

<script>
const API = window.location.origin;
const TOKEN = localStorage.getItem('token');

async function createBox(e) {
  e.preventDefault();
  
  if (!TOKEN) {
    alert('سجل دخول أولاً');
    window.location.href = '/test.html';
    return;
  }
  
  const data = {
    name: document.getElementById('boxName').value,
    layout: {
      width: parseInt(document.getElementById('width').value),
      height: parseInt(document.getElementById('height').value)
    }
  };
  
  try {
    const res = await fetch(API + '/api/boxes', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + TOKEN
      },
      body: JSON.stringify(data)
    });
    
    const result = await res.json();
    
    if (result.success) {
      document.getElementById('successBox').style.display = 'block';
      document.getElementById('result').innerHTML = 
        'الاسم: ' + result.box.name + '<br>' +
        'Embed Key: ' + result.box.embedKey + '<br>' +
        '<a href="/dashboard/index.html" class="btn" style="margin-top:10px;display:inline-block">العودة</a>';
    } else {
      alert('خطأ: ' + result.error);
    }
  } catch (err) {
    alert('خطأ: ' + err.message);
  }
}
</script>
</body>
</html>
