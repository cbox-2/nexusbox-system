<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صناديقي - NexusBox</title>
<link rel="stylesheet" href="/assets/css/admin-theme.css">
</head>
<body>

<!-- Top Black Bar -->
<div class="topbar">
  <div class="logo-area">
    <a href="/" class="logo-text">NexusBox</a>
  </div>
  
  <div class="topbar-user">
    <div class="user-info" id="userEmail">جاري التحميل...</div>
    <div class="topbar-links">
      <a href="/dashboard/account.html">حسابي</a>
      <a href="/dashboard/index.html" class="active">صناديقي</a>
      <a href="/dashboard/support.html">الدعم</a>
      <a href="#" onclick="logout()">تسجيل الخروج</a>
    </div>
  </div>
</div>

<!-- Second Navigation Bar -->
<div class="navbar">
  <div class="navbar-links">
    <a href="/dashboard/messages.html">رسائل</a>
    <a href="/dashboard/users.html">المستخدمون</a>
    <a href="/dashboard/options.html">خيارات</a>
    <a href="/dashboard/lookfeel.html">المظهر والملمس</a>
    <a href="/dashboard/publish.html">نشر</a>
  </div>
</div>

<!-- Main Container -->
<div class="main-container">

  <div class="content-section">
    <h1>📦 صناديق البريد الخاصة بك</h1>
    <p>إدارة جميع صناديق البريد الخاصة بك من مكان واحد</p>
    
    <div style="margin: 30px 0;">
      <a href="/dashboard/create-box.html" class="btn btn-primary" style="font-size: 16px;">➕ إنشاء صندوق جديد</a>
    </div>
    
    <div id="boxes-list" style="margin-top: 30px;">
      <div style="text-align: center; padding: 40px; color: #888;">
        جاري تحميل الصناديق...
      </div>
    </div>
  </div>

</div>

<!-- Footer -->
<div class="footer">
  <p>&copy; 2026 NexusBox - جميع الحقوق محفوظة</p>
</div>

<script>
const API = window.location.origin;
const TOKEN = localStorage.getItem('token');

window.addEventListener('DOMContentLoaded', function() {
  if (!TOKEN) {
    alert('الرجاء تسجيل الدخول أولاً');
    window.location.href = '/test.html';
    return;
  }
  
  loadUserInfo();
  loadBoxes();
});

async function loadUserInfo() {
  try {
    const res = await fetch(API + '/api/auth/me', {
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    });
    const data = await res.json();
    if (data.success && data.user) {
      document.getElementById('userEmail').textContent = data.user.email || data.user.username;
    }
  } catch (error) {
    console.error('Error:', error);
  }
}

async function loadBoxes() {
  try {
    const res = await fetch(API + '/api/boxes', {
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    });
    const data = await res.json();
    
    const container = document.getElementById('boxes-list');
    
    if (!data.success || data.boxes.length === 0) {
      container.innerHTML = `
        <div style="text-align: center; padding: 60px; background: #f8f9fa; border-radius: 10px;">
          <div style="font-size: 64px; margin-bottom: 20px;">📦</div>
          <h2 style="color: #333; margin-bottom: 15px;">لا توجد صناديق بعد</h2>
          <p style="color: #666; margin-bottom: 30px;">أنشئ أول صندوق بريد إلكتروني لك الآن</p>
          <a href="/dashboard/create-box.html" class="btn btn-primary" style="font-size: 16px; padding: 15px 40px;">إنشاء صندوق جديد</a>
        </div>
      `;
      return;
    }
    
    let html = '<div style="display: grid; gap: 20px;">';
    data.boxes.forEach(box => {
      html += `
        <div class="box-item">
          <h3>${box.name}</h3>
          <p><strong>Slug:</strong> ${box.slug}</p>
          <p><strong>Embed Key:</strong> ${box.embedKey}</p>
          <p><strong>الحالة:</strong> ${box.status === 'active' ? '✅ نشط' : '❌ ' + box.status}</p>
          <p><strong>تاريخ الإنشاء:</strong> ${new Date(box.createdAt).toLocaleDateString('ar')}</p>
          <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
            <a href="/dashboard/publish.html?key=${box.embedKey}" class="btn btn-primary">📝 الحصول على كود التضمين</a>
            <a href="/embed.html?key=${box.embedKey}" class="btn btn-success" target="_blank">👁️ معاينة</a>
            <a href="/dashboard/create-box.html?edit=${box._id}" class="btn btn-secondary">✏️ تعديل</a>
          </div>
        </div>
      `;
    });
    html += '</div>';
    
    container.innerHTML = html;
  } catch (error) {
    console.error('Error:', error);
    document.getElementById('boxes-list').innerHTML = '<div style="color: red; padding: 20px;">خطأ في تحميل الصناديق</div>';
  }
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  window.location.href = '/';
}
</script>

</body>
</html>
