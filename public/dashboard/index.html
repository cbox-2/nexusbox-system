<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · NexusBox</title>
<link rel="stylesheet" href="/shared/toolbar.css">
<style>body { background-color: #1e1b4b !important; padding-top: 120px !important; }</style>
</head>
<body dir="ltr">
<div id="header" dir="ltr">
  <div class="wrap">
    <a id="logo" href="/dashboard/index.html">NexusBox</a>
    <div id="headerExtras">
      <span id="userWelcome">admin</span>
      <a href="/dashboard/index.html">My Cboxes</a>
      <a href="#">My Account</a>
      <a href="#">Support</a>
      <a href="#" onclick="globalLogout()">Log out</a>
    </div>
  </div>
</div>
<div id="subbar" dir="ltr">
  <div class="wrap">
    <a href="/dashboard/index.html" class="submenuitem active"><b>MSASDWEC2015HKARNO</b></a>
    <a href="/publish/publish.html" class="submenuitem">Publish</a>
    <a href="/Theme-editor/Theme-editor.html" class="submenuitem">Look & feel</a>
    <a href="/posting-options/index.html" class="submenuitem">Options</a>
    <a href="/registered-users/registered-users.html" class="submenuitem">Users</a>
    <a href="/messages/index.html" class="submenuitem">Messages</a>
  </div>
</div>
<div id="main" style="padding: 20px; color: white;">
  <div id="content-area">
    <h1>Dashboard</h1>
    <p>Welcome to NexusBox Dashboard</p>
  </div>
  <iframe id="content-frame" style="display:none; width:100%; height:600px; border:none; background:#fff;"></iframe>
</div>
<script src="/shared/toolbar.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var links = document.querySelectorAll('#subbar a.submenuitem, #headerExtras a');
  var contentArea = document.getElementById('content-area');
  var contentFrame = document.getElementById('content-frame');
  
  links.forEach(function(link) {
    link.addEventListener('click', function(e) {
      var href = this.getAttribute('href');
      
      // تجاهل الروابط الفارغة أو #
      if (!href || href === '#') return;
      
      e.preventDefault();
      
      // تحديث الزر النشط
      document.querySelectorAll('.submenuitem').forEach(function(btn) {
        btn.classList.remove('active');
      });
      this.classList.add('active');
      
      // إذا كان الرابط dashboard، اعرض المحتوى الأصلي
      if (href === '/dashboard/index.html' || href === '#') {
        contentFrame.style.display = 'none';
        contentArea.style.display = 'block';
        contentArea.innerHTML = '<h1>Dashboard</h1><p>Welcome to NexusBox Dashboard</p>';
      } else {
        // افتح الصفحة في iframe
        contentArea.style.display = 'none';
        contentFrame.style.display = 'block';
        contentFrame.src = href;
      }
    });
  });
});
</script>
</body>
</html>
