<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusBox - Control Panel</title>
<link rel="stylesheet" href="/shared/toolbar.css">
<style>
body {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Tahoma, Arial, sans-serif;
}
.container {
  background: white;
  padding: 40px;
  border-radius: 10px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  text-align: center;
  max-width: 400px;
}
h1 {
  color: #333;
  margin-bottom: 20px;
}
p {
  color: #666;
  margin-bottom: 30px;
}
.btn {
  display: inline-block;
  padding: 12px 30px;
  background: #667eea;
  color: white;
  text-decoration: none;
  border-radius: 5px;
  font-size: 16px;
  transition: background 0.3s;
}
.btn:hover {
  background: #764ba2;
}
</style>
</head>
<body>
<div class="container">
  <h1>🚀 NexusBox</h1>
  <p>Welcome to NexusBox Control Panel</p>
  <a href="/dashboard/index.html" class="btn">Go to Dashboard</a>
</div>
<script src="/shared/nav.js"></script>
</body>
</html>
