<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!--PAGE_TITLE--></title>
<link rel="stylesheet" href="/assets/css/admin-theme.css">
<!--EXTRA_CSS-->
</head>
<body>

<!-- Top Black Bar -->
<div class="topbar">
  <div class="logo-area">
    <a href="/dashboard/index.html" class="logo-text">NexusBox</a>
  </div>
  
  <div class="topbar-user">
    <div class="user-info" id="userEmail">Loading...</div>
    <div class="topbar-links">
      <a href="/dashboard/account.html">حسابي</a>
      <a href="/dashboard/index.html">صناديقي</a>
      <a href="/dashboard/support.html">الدعم</a>
      <a href="#" onclick="logout()">تسجيل الخروج</a>
    </div>
  </div>
</div>

<!-- Second Navigation Bar -->
<div class="navbar">
  <div class="navbar-links">
    <a href="/dashboard/messages.html" class="nav-link" data-page="messages">رسائل</a>
    <a href="/dashboard/users.html" class="nav-link" data-page="users">المستخدمون</a>
    <a href="/dashboard/options.html" class="nav-link" data-page="options">خيارات</a>
    <a href="/dashboard/lookfeel.html" class="nav-link" data-page="lookfeel">المظهر والملمس</a>
    <a href="/dashboard/publish.html" class="nav-link active" data-page="publish">نشر</a>
  </div>
</div>

<!-- Main Content -->
<div class="main-container">
  <!--CONTENT-->
</div>

<!-- Footer -->
<div class="footer">
  <p>&copy; 2026 NexusBox - جميع الحقوق محفوظة</p>
</div>

<script>
const API = window.location.origin;
const TOKEN = localStorage.getItem('token');

// Check authentication
if (!TOKEN && !window.location.pathname.includes('/login') && !window.location.pathname.includes('/test.html')) {
  // Allow public pages
  if (!['/embed.html', '/widget.js'].some(p => window.location.pathname.includes(p))) {
    // Don't redirect, just show warning
  }
}

// Load user info
window.addEventListener('DOMContentLoaded', function() {
  if (TOKEN) {
    loadUserInfo();
    setActiveNav();
  }
});

async function loadUserInfo() {
  try {
    const res = await fetch(API + '/api/auth/me', {
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    });
    const data = await res.json();
    if (data.success && data.user) {
      const userEmail = document.getElementById('userEmail');
      if (userEmail) {
        userEmail.textContent = data.user.email || data.user.username;
      }
    }
  } catch (error) {
    console.error('Error loading user info:', error);
  }
}

function setActiveNav() {
  const currentPage = window.location.pathname.split('/').pop() || 'index.html';
  const pageName = currentPage.replace('.html', '');
  
  document.querySelectorAll('.nav-link').forEach(link => {
    link.classList.remove('active');
    if (link.dataset.page === pageName) {
      link.classList.add('active');
    }
  });
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  window.location.href = '/test.html';
}
</script>

<!--EXTRA_JS-->

</body>
</html>
