<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="تسجيل الدخول · NexusBox">
<meta name="twitter:description" content="Secure login to NexusBox control panel">
<meta property="og:title" content="تسجيل الدخول · NexusBox">
<meta property="og:description" content="تسجيل الدخول · NexusBox - Professional chat platform">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nexusbox-system-production-c290.up.railway.app/">

<meta name="description" content="تسجيل الدخول · NexusBox - Professional chat platform by NexusBox">
<link rel="canonical" href="https://nexusbox-system-production-c290.up.railway.app/login">
<link rel="icon" type="image/svg+xml" href="/shared/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول · NexusBox</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: Tahoma, Arial, sans-serif;
  background: linear-gradient(135deg, #1e1b4b, #312e81);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}
.login-container {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  padding: 40px;
  border-radius: 15px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
h1 {
  text-align: center;
  margin-bottom: 30px;
  color: #fff;
}
.form-group {
  margin-bottom: 20px;
}
label {
  display: block;
  margin-bottom: 8px;
  color: #ddd;
  font-size: 14px;
}
input {
  width: 100%;
  padding: 12px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
}
input:focus {
  outline: none;
  border-color: #4a7fb5;
}
button {
  width: 100%;
  padding: 12px;
  background: #4a7fb5;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  transition: background 0.3s;
}
button:hover {
  background: #3a6a9a;
}
.error {
  background: rgba(255,0,0,0.2);
  color: #ff6b6b;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 20px;
  display: none;
}
.success {
  background: rgba(0,255,0,0.2);
  color: #6bff6b;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 20px;
  display: none;
}
.links {
  text-align: center;
  margin-top: 20px;
}
.links a {
  color: #4a7fb5;
  text-decoration: none;
}
.links a:hover {
  text-decoration: underline;
}
</style>
</head>
<body>
<div class="login-container">
  <h1>🔐 تسجيل الدخول</h1>
  
  <div class="error" id="error-msg"></div>
  <div class="success" id="success-msg"></div>
  
  <form id="login-form">
    <div class="form-group">
      <label>اسم المستخدم أو البريد الإلكتروني</label>
      <input type="text" id="username" required>
    </div>
    
    <div class="form-group">
      <label>كلمة المرور</label>
      <input type="password" id="password" required>
    </div>
    
    <button type="submit">دخول</button>
  </form>
  
  <div class="links">
    <p>ليس لديك حساب؟ <a href="/signup/signup.html">سجل الآن</a></p>
  </div>
</div>

<script>
// التحقق من تسجيل الدخول الحالي
const token = localStorage.getItem('token');
if (token) {
  fetch('/api/auth/me', {
    headers: { 'Authorization': 'Bearer ' + token }
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      window.location.href = '/dashboard/index.html';
    }
  })
  .catch(() => {
    localStorage.removeItem('token');
  });
}

document.getElementById('login-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errorDiv = document.getElementById('error-msg');
  const successDiv = document.getElementById('success-msg');
  
  errorDiv.style.display = 'none';
  successDiv.style.display = 'none';
  
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    
    const data = await res.json();
    
    if (data.success) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      
      successDiv.textContent = 'تم تسجيل الدخول بنجاح! جاري التحويل...';
      successDiv.style.display = 'block';
      
      setTimeout(() => {
        window.location.href = '/dashboard/index.html';
      }, 1000);
    } else {
      errorDiv.textContent = data.error || 'خطأ في تسجيل الدخول';
      errorDiv.style.display = 'block';
    }
  } catch (error) {
    errorDiv.textContent = 'خطأ في الاتصال بالسيرفر';
    errorDiv.style.display = 'block';
  }
});
</script>
<script src="/shared/nav.js"></script>
</body>
</html>
