<style>
body { background-color: #1e1b4b !important; padding-top: 20px !important; color: white; }
.message-list { margin-top: 20px; }
.message-item {
  background: rgba(255,255,255,0.1);
  padding: 15px;
  margin-bottom: 10px;
  border-radius: 8px;
  border-right: 4px solid #4a7fb5;
}
.message-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 13px;
  color: #aaa;
}
.message-content { margin-bottom: 10px; }
.message-actions { display: flex; gap: 10px; }
.btn {
  padding: 6px 12px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
}
.btn-delete { background: #dc3545; color: white; }
.btn-pin { background: #ffc107; color: black; }
.btn:hover { opacity: 0.8; }
.add-message-form {
  background: rgba(255,255,255,0.1);
  padding: 20px;
  border-radius: 8px;
  margin-bottom: 20px;
}
.form-group { margin-bottom: 15px; }
.form-group label { display: block; margin-bottom: 5px; }
.form-group textarea, .form-group select {
  width: 100%;
  padding: 10px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 5px;
  color: white;
  font-family: inherit;
}
.form-group textarea { min-height: 100px; resize: vertical; }
.sticky-badge {
  background: #ffc107;
  color: black;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 11px;
  margin-right: 10px;
}
</style>

<body>

<div class="wrap">

<div id="hovmenu" class="wrap" style="display:none"></div>
</div>

	<div id="main">
  <h1>الرسائل</h1>
  <p>إدارة رسائل النظام</p>
  
  <div class="add-message-form">
    <h3>إرسال رسالة جديدة</h3>
    <form id="add-message-form">
      <div class="form-group">
        <label>المحتوى</label>
        <textarea id="message-content" required></textarea>
      </div>
      <div class="form-group">
        <label>القناة</label>
        <select id="message-channel">
          <option value="general">عامة</option>
          <option value="announcements">إعلانات</option>
          <option value="support">دعم فني</option>
        </select>
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" id="message-sticky"> تثبيت الرسالة
        </label>
      </div>
      <button type="submit" class="btn btn-edit">إرسال</button>
    </form>
  </div>
  
  <div class="message-list" id="message-list">
    <p>جاري تحميل الرسائل...</p>
  </div>
</div>

<script src="code.js"></script>
<script>
const token = localStorage.getItem('token');

// تحميل الرسائل
async function loadMessages() {
  try {
    const res = await fetch('/api/messages', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await res.json();
    
    if (data.success) {
      const messageList = document.getElementById('message-list');
      messageList.innerHTML = '';
      
      // ترتيب: المثبتة أولاً
      const sorted = data.messages.sort((a, b) => {
        if (a.isSticky && !b.isSticky) return -1;
        if (!a.isSticky && b.isSticky) return 1;
        return new Date(b.createdAt) - new Date(a.createdAt);
      });
      
      sorted.forEach(msg => {
        const messageItem = document.createElement('div');
        messageItem.className = 'message-item';
        if (msg.isSticky) messageItem.style.borderRightColor = '#ffc107';
        
        messageItem.innerHTML = `
          <div class="message-header">
            <div>
              <strong>${msg.author?.username || 'Unknown'}</strong>
              ${msg.isSticky ? '<span class="sticky-badge">مثبتة</span>' : ''}
              <span>${msg.channel}</span>
            </div>
            <div>${new Date(msg.createdAt).toLocaleString('ar')}</div>
          </div>
          <div class="message-content">${msg.content}</div>
          <div class="message-actions">
            <button class="btn btn-pin" onclick="togglePin('${msg._id}', ${msg.isSticky})">
              ${msg.isSticky ? 'إلغاء التثبيت' : 'تثبيت'}
            </button>
            <button class="btn btn-delete" onclick="deleteMessage('${msg._id}')">حذف</button>
          </div>
        `;
        messageList.appendChild(messageItem);
      });
    }
  } catch (error) {
    console.error('Error loading messages:', error);
  }
}

// إضافة رسالة
document.getElementById('add-message-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const content = document.getElementById('message-content').value;
  const channel = document.getElementById('message-channel').value;
  const isSticky = document.getElementById('message-sticky').checked;
  
  try {
    const res = await fetch('/api/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({ content, channel, isSticky })
    });
    
    const data = await res.json();
    
    if (data.success) {
      alert('تم إرسال الرسالة!');
      loadMessages();
      this.reset();
    } else {
      alert('خطأ: ' + data.error);
    }
  } catch (error) {
    alert('خطأ في الاتصال');
  }
});

// تثبيت/إلغاء تثبيت رسالة
async function togglePin(messageId, currentStatus) {
  try {
    const res = await fetch(`/api/messages/${messageId}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({ isSticky: !currentStatus })
    });
    
    const data = await res.json();
    
    if (data.success) {
      loadMessages();
    }
  } catch (error) {
    alert('خطأ في الاتصال');
  }
}

// حذف رسالة
async function deleteMessage(messageId) {
  if (!confirm('هل أنت متأكد من حذف هذه الرسالة؟')) return;
  
  try {
    const res = await fetch(`/api/messages/${messageId}`, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    
    const data = await res.json();
    
    if (data.success) {
      loadMessages();
    }
  } catch (error) {
    alert('خطأ في الاتصال');
  }
}

// تحميل الرسائل عند فتح الصفحة
loadMessages();
</script>
<script src="/shared/nav.js"></script>
</body>
