<script>
function copyCode() {
  var textarea = document.getElementById('embed-code');
  textarea.select();
  document.execCommand('copy');
  alert('Code copied to clipboard!');
}

document.addEventListener('DOMContentLoaded', function() {
  loadUserInfo().then(function(user) {
    if (user) {
      document.getElementById('embed-code').value = '<iframe src="https://nexusbox-system-production-c290.up.railway.app/chat/chat.html?user=' + user.username + '" width="400" height="500"></iframe>';
    }
  });
});
</script>
