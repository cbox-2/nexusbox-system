<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, user-scalable=no">
<title>NexusBox Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:12px Tahoma,Arial,sans-serif;background:#fff;color:#333}
.bar{background:#f5f5f5;border-bottom:1px solid #ddd;padding:5px 10px;display:flex;gap:5px;align-items:center}
.btn{background:#fff;border:1px solid #bbb;padding:3px 8px;font-size:11px;cursor:pointer;border-radius:2px}
.btn:hover{background:#e0e0e0}
fieldset{border:0;padding:10px;background:#fff}
input[type=text],textarea{width:100%;padding:6px;border:2px solid #059ad0;font-size:12px;border-radius:2px;outline:none;margin:5px 0}
input[type=text]:focus,textarea:focus{outline:1px dotted #059ad0}
textarea{height:60px;resize:none}
button[type=submit]{background:#059ad0;color:#fff;border:2px solid #059ad0;padding:6px 15px;cursor:pointer;border-radius:2px}
button[type=submit]:hover{background:#0379a3}
#messages{height:300px;overflow-y:auto;padding:10px;background:#f9f9f9}
.msg{padding:5px 0;border-bottom:1px solid #eee;display:flex;gap:8px}
.msg .flag{width:16px;height:11px}
.msg .nme{font-weight:bold;color:#059ad0;margin-right:5px}
.msg .body{flex:1}
.msg .dtxt{font-size:10px;color:#999}
#users{background:#fff;padding:10px;font-size:11px;color:#666}
</style>
</head>
<body>

<div class="bar">
  <button class="btn">👤 Profile</button>
  <button class="btn">🔊 Sound</button>
  <button class="btn">↗️ Pop out</button>
</div>

<fieldset>
  <input type="text" placeholder="name" maxlength="25">
  <textarea placeholder="message"></textarea>
  <button type="submit">Post</button>
</fieldset>

<div id="messages">
  <div class="msg">
    <img class="flag" src="a_data/jo.png" alt="JO">
    <div>
      <span class="nme">dorocane</span>
      <span class="body">Welcome to NexusBox! 💙</span>
      <span class="dtxt">just now</span>
    </div>
  </div>
  <div class="msg">
    <img class="flag" src="a_data/us.png" alt="US">
    <div>
      <span class="nme">Gi</span>
      <span class="body">Hello everyone! 👋</span>
      <span class="dtxt">1 min ago</span>
    </div>
  </div>
  <div class="msg">
    <img class="flag" src="a_data/gb.png" alt="GB">
    <div>
      <span class="nme">Dan</span>
      <span class="body">Nice design! 🎨</span>
      <span class="dtxt">2 min ago</span>
    </div>
  </div>
</div>

<div id="users">
  <strong>25</strong> users online
</div>

<script>
// محاكاة إرسال رسالة
document.querySelector('button[type=submit]').addEventListener('click', function(e){
  e.preventDefault();
  const name = document.querySelector('input[type=text]').value || 'Guest';
  const msg = document.querySelector('textarea').value;
  if(!msg) return alert('Please type a message');
  
  const messages = document.getElementById('messages');
  const newMsg = document.createElement('div');
  newMsg.className = 'msg';
  newMsg.innerHTML = `
    <img class="flag" src="a_data/us.png" alt="US">
    <div>
      <span class="nme">${name}</span>
      <span class="body">${msg}</span>
      <span class="dtxt">just now</span>
    </div>
  `;
  messages.appendChild(newMsg);
  messages.scrollTop = messages.scrollHeight;
  document.querySelector('textarea').value = '';
});
</script>

<script src="/shared/nav.js"></script>
</body>
</html>
